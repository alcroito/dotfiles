[mgr]
show_hidden = true

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", block = true, for = "unix" },
	{ run = "nvim %s",    block = true,                        for = "windows" },
	{ run = 'code %s',    orphan = true, desc = "code",         for = "windows" },
	{ run = 'code -w %s', block = true,  desc = "code (block)", for = "windows" },
]
